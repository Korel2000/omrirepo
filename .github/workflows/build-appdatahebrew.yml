name: Build AppDataHebrew
on:
  push:
    paths: ['src/appdatahebrew/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: src/appdatahebrew
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - run: make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: AppDataHebrew-deb
          path: src/appdatahebrew/packages/*.deb
